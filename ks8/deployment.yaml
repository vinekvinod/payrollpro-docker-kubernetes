
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payroll
  template:
    metadata:
      labels:
        app: payroll
    spec:
      containers:
        - name: payroll
          image: payroll-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
